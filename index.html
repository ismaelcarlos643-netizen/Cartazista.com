<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartazista Simples</title>
    <style>
        /* Layout Geral (Preto e Azul) */
        body {
            font-family: 'Arial Black', sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .painel {
            background-color: #1c2541;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            font-size: 16px;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 4px;
            border: none;
            margin-top: 10px;
        }
        button {
            width: 100%;
            background-color: #22c55e;
            color: white;
            padding: 12px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            margin-top: 10px;
            cursor: pointer;
        }

        /* O Cartaz (Amarelo e Vermelho) */
        .area-cartazes {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .cartaz {
            background-color: #ffea00;
            border: 12px solid #ff0000;
            border-radius: 8px;
            width: 100%;
            max-width: 320px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            text-transform: uppercase;
        }
        .oferta {
            background-color: #ff0000;
            color: white;
            font-size: 28px;
            padding: 5px;
            transform: rotate(-2deg);
            margin-bottom: 20px;
        }
        .produto {
            color: #000000;
            font-size: 32px;
            line-height: 1.1;
            margin: 20px 0;
            font-weight: 900;
        }
        .preco-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: #ff0000;
        }
        .cifrao {
            font-size: 20px;
            margin-top: 10px;
            margin-right: 2px;
        }
        .reais {
            font-size: 110px;
            line-height: 0.8;
            font-weight: 900;
        }
        .centavos {
            font-size: 50px;
            line-height: 0.8;
            margin-top: 8px;
        }

        /* Configuração de Impressão */
        @media print {
            .no-print { display: none !important; }
            body { background: none; padding: 0; }
            .cartaz {
                margin: 0 auto;
                page-break-after: always;
                max-width: 100%;
                height: 96vh;
                border-width: 25px;
            }
            .reais { font-size: 240px; }
            .centavos { font-size: 100px; }
            .produto { font-size: 60px; }
        }
    </style>
</head>
<body>

    <!-- Menu de Entrada de Texto -->
    <div class="painel no-print">
        <label><strong>DIGITE: PRODUTO, PREÇO (UM POR LINHA)</strong></label>
        <textarea id="lista" oninput="criar()"></textarea>
        <button onclick="window.print()">IMPRIMIR CARTAZES</button>
    </div>

    <!-- Onde os cartazes aparecem -->
    <div class="area-cartazes" id="resultado"></div>

    <script>
        // Função ultraleve que não quebra se o usuário errar a digitação
        function criar() {
            const caixaTexto = document.getElementById('lista');
            const espacoGeral = document.getElementById('resultado');
            
            const linhas = caixaTexto.value.split('\n');
            espacoGeral.innerHTML = ''; 

            for (let i = 0; i < linhas.length; i++) {
                let linha = linhas[i].trim();
                if (linha === '' || !linha.includes(',')) continue;

                let partes = linha.split(',');
                let nomeProd = partes[0].trim();
                let precoProd = partes[1].trim();

                // Converte texto em número válido
                let numero = parseFloat(precoProd.replace(/[^0-9.]/g, ''));
                if (isNaN(numero)) continue;

                // Divide Reais de Centavos
                let arrPreco = numero.toFixed(2).split('.');
                let reais = arrPreco[0];
                let centavos = arrPreco[1];

                // Desenha o cartaz na tela
                espacoGeral.innerHTML += `
                    <div class="cartaz">
                        <div class="oferta">OFERTA</div>
                        <div class="produto">${nomeProd}</div>
                        <div class="preco-container">
                            <span class="cifrao">R$</span>
                            <span class="reais">${reais}</span>
                            <span class="centavos">,${centavos}</span>
                        </div>
                    </div>
                `;
            }
        }
        
        // Carrega um exemplo padrão na primeira abertura do site
        document.getElementById('lista').value = "Arroz 5kg, 24.90\nFeijão 1kg, 7.49";
        criar();
    </script>

</body>
</html>
