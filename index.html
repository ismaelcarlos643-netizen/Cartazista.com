<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CartazFast - Editor Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Permanent+Marker&family=Anton&display=swap" rel="stylesheet">
    
    <style>
        /* --- ESTILOS DA INTERFACE (UI) --- */
        :root {
            --bg-general: #121824;
            --bg-panel: #1E293B;
            --text-main: #F8FAFC;
            --text-secondary: #94A3B8;
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --success: #16A34A;
            --danger: #DC2626;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-general);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-panel);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .btn {
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: #15803D; }
        .btn-secondary { background-color: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-secondary:hover { background-color: #2d3748; color: white; }
        .btn-danger { background-color: var(--danger); padding: 0.4rem 0.7rem; font-size: 0.8rem;}

        .main-container { display: flex; flex: 1; overflow: hidden; }

        /* Painel Esquerdo */
        .control-panel {
            width: 35%;
            background-color: var(--bg-panel);
            padding: 1.5rem;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.25rem;
            font-weight: 700;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        label { font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; }
        
        input[type="text"], input[type="number"], select {
            background-color: var(--bg-general);
            border: 1px solid var(--border);
            color: white;
            padding: 0.6rem;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--primary); }

        .price-row { display: flex; gap: 0.5rem; }
        .price-main { flex: 2; }
        .price-cents { flex: 1; }

        .radio-tile-group { display: flex; gap: 0.4rem; }
        .radio-tile {
            flex: 1;
            text-align: center;
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--bg-general);
        }
        .radio-tile.active { background-color: var(--primary); border-color: var(--primary); color: white;}

        /* Lista / Fila de Produtos */
        .product-list {
            background: var(--bg-general);
            border: 1px solid var(--border);
            border-radius: 6px;
            max-height: 180px;
            overflow-y: auto;
            padding: 0.5rem;
        }
        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }
        .product-item:last-child { border-bottom: none; }

        /* Área do Preview (Direita) */
        .preview-area {
            width: 65%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            overflow: auto;
            background-color: var(--bg-general);
        }

        /* Container da Folha de Impressão */
        .print-sheet {
            background: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: grid;
            gap: 0px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* Tamanhos da Folha Base baseados em proporção A4 (Modo Retrato padrão) */
        .print-sheet.retrato { width: 420px; height: 594px; grid-template-columns: 100%; grid-template-rows: 100%; }
        .print-sheet.paisagem { width: 594px; height: 420px; grid-template-columns: 100%; grid-template-rows: 100%; }
        
        /* Layout de 4 Cartazes por Folha */
        .print-sheet.grid-4.retrato { grid-template-columns: 50% 50%; grid-template-rows: 50% 50%; }
        .print-sheet.grid-4.paisagem { grid-template-columns: 50% 50%; grid-template-rows: 50% 50%; }

        /* --- ESTILOS DO CARTAZ --- */
        .poster {
            background-color: #FFE600; /* Amarelo */
            color: #000000;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            position: relative;
            border: 12px solid #FF0000; /* Borda Vermelha Padrão */
            box-sizing: border-box;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* Variações de Cores pedidas */
        .poster.bg-amarelo { background-color: #FFE600; color: #000; border-color: #FF0000; }
        .poster.bg-vermelho { background-color: #E11D48; color: #FFF; border-color: #FFE600; }
        .poster.bg-branco-vermelho { background-color: #FFFFFF; color: #000; border-color: #FF0000; } /* Branco com borda vermelha */

        /* Fontes */
        .poster.font-letrista { font-family: 'Permanent Marker', cursive; }
        .poster.font-impact { font-family: 'Anton', sans-serif; }

        .poster-header {
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            background: #FF0000;
            color: white;
            padding: 0.1rem 1.5rem;
            transform: skewX(-10deg);
            margin-top: 0.2rem;
        }
        .bg-vermelho .poster-header { background: #FFE600; color: black; }
        .bg-branco-vermelho .poster-header { background: #FF0000; color: white; }

        .poster-product {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.1;
            text-transform: uppercase;
            margin: auto 0;
        }

        .poster-price-container {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            font-family: 'Anton', sans-serif;
            line-height: 0.8;
            margin-bottom: auto;
        }

        .poster-currency { font-size: 1.5rem; margin-right: 0.2rem; margin-top: 0.5rem; }
        .poster-price-main { font-size: 6.5rem; font-weight: bold; }
        .poster-price-cents-box { display: flex; flex-direction: column; align-items: flex-start; }
        .poster-price-cents { font-size: 3rem; font-weight: bold; text-decoration: underline; }
        .poster-unit { font-size: 1.1rem; text-transform: uppercase; font-weight: bold; margin-top: 0.2rem;}

        .poster-footer {
            font-size: 0.8rem;
            font-weight: 700;
            border-top: 2px dashed rgba(0,0,0,0.2);
            width: 100%;
            padding-top: 0.5rem;
            text-transform: uppercase;
        }
        
        /* Ajustes finos quando há 4 cartazes na folha (Fontes menores para caber) */
        .grid-4 .poster { border-width: 6px; padding: 0.5rem; }
        .grid-4 .poster-header { font-size: 1.1rem; }
        .grid-4 .poster-product { font-size: 1.1rem; }
        .grid-4 .poster-price-main { font-size: 3.8rem; }
        .grid-4 .poster-price-cents { font-size: 1.8rem; }
        .grid-4 .poster-currency { font-size: 1rem; }
        .grid-4 .poster-unit { font-size: 0.8rem; }
        .grid-4 .poster-footer { font-size: 0.6rem; }

        .hidden { display: none !important; }

        /* --- REGRAS DE IMPRESSÃO NATIVA --- */
        @media print {
            body *, header, .control-panel { display: none !important; }
            body, .main-container, .preview-area { background: #fff !important; padding: 0 !important; margin: 0 !important; height: 100vh !important; width: 100vw !important; display: flex !important; justify-content: center !important; align-items: center !important; }
            .print-sheet { border: none !important; box-shadow: none !important; width: 100vw !important; height: 100vh !important; display: grid !important; }
            @page { margin: 0; }
        }
    </style>
</head>
<body>

    <header>
        <button class="btn btn-secondary">← Voltar</button>
        <div style="font-weight: 600;">Editor de Cartazes Pro</div>
        <button class="btn btn-success" onclick="window.print()">🖨️ Imprimir Folha Atual</button>
    </header>

    <div class="main-container">
        
        <aside class="control-panel">
            
            <div>
                <div class="section-title">1. Configuração da Folha</div>
                <div class="form-group" style="margin-bottom: 0.8rem;">
                    <label>Orientação da Página</label>
                    <div class="radio-tile-group">
                        <div id="opt-retrato" class="radio-tile active" onclick="setOrientacao('retrato')">Retrato (Em pé)</div>
                        <div id="opt-paisagem" class="radio-tile" onclick="setOrientacao('paisagem')">Paisagem (Deitado)</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Quantidade por Folha</label>
                    <div class="radio-tile-group">
                        <div id="opt-qtd-1" class="radio-tile active" onclick="setLayoutQtd(1)">1 Grande</div>
                        <div id="opt-qtd-4" class="radio-tile" onclick="setLayoutQtd(4)">4 Pequenos</div>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">2. Produto Atual</div>
                <div class="form-group" style="margin-bottom: 0.6rem;">
                    <label>Nome do Produto</label>
                    <input type="text" id="input-name" value="Arroz Tipo 1 5kg">
                </div>
                
                <div class="price-row" style="margin-bottom: 0.6rem;">
                    <div class="form-group price-main">
                        <label>Preço R$</label>
                        <input type="number" id="input-price" value="19">
                    </div>
                    <div class="form-group price-cents">
                        <label>Centavos</label>
                        <input type="text" id="input-cents" value="98" maxlength="2">
                    </div>
                </div>

                <div class="price-row" style="margin-bottom: 0.6rem;">
                    <div class="form-group" style="flex:1;">
                        <label>Unidade</label>
                        <select id="input-unit">
                            <option value="Un">Un</option>
                            <option value="Kg" selected>Kg</option>
                            <option value="L">Litro</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:2;">
                        <label>Texto Rodapé</label>
                        <input type="text" id="input-footer" value="Máximo 3 un por cliente">
                    </div>
                </div>

                <button class="btn btn-primary" style="width: 100%; margin-top: 0.4rem;" onclick="adicionarProdutoDaqui()">
                    ➕ Adicionar à Fila de Impressão
                </button>
            </div>

            <div>
                <div class="section-title">3. Estilo do Cartaz</div>
                
                <div class="form-group" style="margin-bottom: 0.6rem;">
                    <label>Cor do Fundo / Borda</label>
                    <div class="radio-tile-group">
                        <div id="opt-bg-amarelo" class="radio-tile active" onclick="setVisualBg('amarelo')">Amarelo</div>
                        <div id="opt-bg-vermelho" class="radio-tile" onclick="setVisualBg('vermelho')">Vermelho</div>
                        <div id="opt-bg-branco" class="radio-tile" onclick="setVisualBg('branco-vermelho')">Branco/Vermelho</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Estilo de Letra</label>
                    <div class="radio-tile-group">
                        <div id="opt-font-letrista" class="radio-tile active" onclick="setVisualFont('letrista')">Letrista</div>
                        <div id="opt-font-impact" class="radio-tile" onclick="setVisualFont('impact')">Impact</div>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">4. Fila / Lista de Produtos (<span id="count-fila">1</span>)</div>
                <div class="product-list" id="lista-produtos-ui">
                    </div>
            </div>

        </aside>

        <main class="preview-area">
            <div id="print-sheet" class="print-sheet retrato">
                </div>
        </main>
    </div>

    <script>
        // Estado Global da Aplicação
        let configuracao = {
            orientacao: 'retrato', // retrato ou paisagem
            layoutQtd: 1,          // 1 ou 4 por folha
            bgEstilo: 'bg-amarelo',
            fontEstilo: 'font-letrista'
        };

        // Banco de dados em memória contendo a lista/fila de produtos inseridos
        let filaProdutos = [
            { name: "Arroz Tipo 1 5kg", price: "19", cents: "98", unit: "Kg", footer: "Máximo 3 un por cliente" }
        ];

        // Elementos de input da interface
        const inputName = document.getElementById('input-name');
        const inputPrice = document.getElementById('input-price');
        const inputCents = document.getElementById('input-cents');
        const inputUnit = document.getElementById('input-unit');
        const inputFooter = document.getElementById('input-footer');
        const sheetElement = document.getElementById('print-sheet');

        // Escuta digitação em tempo real para atualizar o primeiro cartaz da preview imediatamente
        [inputName, inputPrice, inputCents, inputUnit, inputFooter].forEach(input => {
            input.addEventListener('input', () => {
                if(filaProdutos.length > 0) {
                    filaProdutos[0] = {
                        name: inputName.value,
                        price: inputPrice.value,
                        cents: inputCents.value,
                        unit: inputUnit.value,
                        footer: inputFooter.value
                    };
                    renderizarFolha();
                    renderizarListaUI();
                }
            });
        });

        function adicionarProdutoDaqui() {
            filaProdutos.push({
                name: inputName.value,
                price: inputPrice.value,
                cents: inputCents.value,
                unit: inputUnit.value,
                footer: inputFooter.value
            });
            renderizarFolha();
            renderizarListaUI();
        }

        function removerProduto(index) {
            filaProdutos.splice(index, 1);
            renderizarFolha();
            renderizarListaUI();
        }

        // Altera a orientação (Retrato / Paisagem)
        function setOrientacao(tipo) {
            configuracao.orientacao = tipo;
            document.getElementById('opt-retrato').classList.toggle('active', tipo === 'retrato');
            document.getElementById('opt-paisagem').classList.toggle('active', tipo === 'paisagem');
            renderizarFolha();
        }

        // Altera a divisão da folha (1 ou 4 cartazes)
        function setLayoutQtd(qtd) {
            configuracao.layoutQtd = qtd;
            document.getElementById('opt-qtd-1').classList.toggle('active', qtd === 1);
            document.getElementById('opt-qtd-4').classList.toggle('active', qtd === 4);
            renderizarFolha();
        }

        // Altera cores de fundo
        function setVisualBg(cor) {
            configuracao.bgEstilo = 'bg-' + cor;
            ['amarelo', 'vermelho', 'branco'].forEach(c => {
                document.getElementById('opt-bg-' + c).classList.toggle('active', c === cor);
            });
            renderizarFolha();
        }

        // Altera o estilo da fonte
        function setVisualFont(fonte) {
            configuracao.fontEstilo = 'font-' + fonte;
            document.getElementById('opt-font-letrista').classList.toggle('active', fonte === 'letrista');
            document.getElementById('opt-font-impact').classList.toggle('active', fonte === 'impact');
            renderizarFolha();
        }

        // Renderiza visualmente a folha e distribui os cartazes nela
        function renderizarFolha() {
            // Atualiza classes da folha container
            sheetElement.className = `print-sheet ${configuracao.orientacao}`;
            if(configuracao.layoutQtd === 4) {
                sheetElement.classList.add('grid-4');
            }

            sheetElement.innerHTML = '';
            
            // Define quantos cartazes vamos exibir na folha física atual
            let limite = configuracao.layoutQtd;
            
            for(let i = 0; i < limite; i++) {
                // Se não houver produto na fila para preencher o espaço, cria um modelo genérico vazio
                let prod = filaProdutos[i] || { name: "Espaço Vazio", price: "00", cents: "00", unit: "un", footer: "" };
                
                let formatCents = prod.cents;
                if(formatCents && !formatCents.startsWith(',')) formatCents = ',' + formatCents;

                let posterHTML = `
                    <div class="poster ${configuracao.bgEstilo} ${configuracao.fontEstilo}">
                        <div class="poster-header">OFERTA</div>
                        <div class="poster-product">${prod.name || 'PRODUTO'}</div>
                        <div class="poster-price-container">
                            <span class="poster-currency">R$</span>
                            <span class="poster-price-main">${prod.price || '0'}</span>
                            <div class="poster-price-cents-box">
                                <span class="poster-price-cents">${formatCents || ',00'}</span>
                                <span class="poster-unit">
