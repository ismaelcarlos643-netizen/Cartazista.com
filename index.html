<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CartazFast - Editor Pro Blindado</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <style>
        /* --- INTERFACE DO SISTEMA --- */
        :root {
            --bg-general: #121824;
            --bg-panel: #1E293B;
            --text-main: #F8FAFC;
            --text-secondary: #94A3B8;
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --success: #16A34A;
            --danger: #DC2626;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }

        body {
            background-color: var(--bg-general);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-panel);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .btn {
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success); }
        .btn-secondary { background-color: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-danger { background-color: var(--danger); padding: 0.3rem 0.6rem; font-size: 0.8rem; border-radius: 4px;}

        .main-container { display: flex; flex: 1; overflow: hidden; }

        /* Painel Lateral */
        .control-panel {
            width: 35%;
            background-color: var(--bg-panel);
            padding: 1.5rem;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.25rem;
            font-weight: 700;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        label { font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; }
        
        input[type="text"], input[type="number"], select {
            background-color: var(--bg-general);
            border: 1px solid var(--border);
            color: white;
            padding: 0.6rem;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .price-row { display: flex; gap: 0.5rem; }
        .price-main { flex: 2; }
        .price-cents { flex: 1; }

        .radio-tile-group { display: flex; gap: 0.4rem; }
        .radio-tile {
            flex: 1;
            text-align: center;
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--bg-general);
            color: var(--text-secondary);
        }
        .radio-tile.active { background-color: var(--primary); border-color: var(--primary); color: white;}

        .product-list {
            background: var(--bg-general);
            border: 1px solid var(--border);
            border-radius: 6px;
            max-height: 150px;
            overflow-y: auto;
            padding: 0.5rem;
        }
        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        /* Área do Preview (Direita) */
        .preview-area {
            width: 65%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            overflow: auto;
            background-color: var(--bg-general);
        }

        /* --- FOLHA DE IMPRESSÃO --- */
        .print-sheet {
            background: #ffffff !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: block;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Tamanhos Proporcionais da Folha na Tela */
        .print-sheet.retrato { width: 420px; height: 594px; }
        .print-sheet.paisagem { width: 594px; height: 420px; }

        /* Grid de Distribuição interna da folha */
        .grid-container {
            display: grid;
            width: 100%;
            height: 100%;
            grid-template-columns: 100%;
            grid-template-rows: 100%;
            box-sizing: border-box;
        }
        .grid-4-active {
            grid-template-columns: 50% 50% !important;
            grid-template-rows: 50% 50% !important;
        }

        /* --- ESTILOS DO CARTAZ DE VAREJO --- */
        .poster {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 1.5rem;
            overflow: hidden;
            border: 14px solid #FF0000; /* Borda padrão */
        }

        /* Temas de cores corrigidos e garantidos */
        .poster.bg-amarelo { background-color: #FFE600 !important; color: #000000 !important; border-color: #FF0000 !important; }
        .poster.bg-vermelho { background-color: #E11D48 !important; color: #FFFFFF !important; border-color: #FFE600 !important; }
        .poster.bg-branco-vermelho { background-color: #FFFFFF !important; color: #000000 !important; border-color: #FF0000 !important; }

        /* Fontes com Fallbacks (Se a webfont falhar, usa a do sistema) */
        .poster.font-letrista { font-family: 'Permanent Marker', 'Arial Black', Gadget, sans-serif; }
        .poster.font-impact { font-family: 'Anton', 'Impact', Charcoal, sans-serif; }

        .poster-header {
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            background: #FF0000;
            color: #FFFFFF;
            padding: 0.2rem 1.5rem;
            transform: skewX(-10deg);
        }
        .bg-vermelho .poster-header { background: #FFE600; color: #000000; }
        .bg-branco-vermelho .poster-header { background: #FF0000; color: #FFFFFF; }

        .poster-product {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.1;
            text-transform: uppercase;
            margin: auto 0;
            color: inherit; /* Garante que herda a cor do tema */
        }

        .poster-price-container {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            font-family: 'Anton', 'Impact', sans-serif;
            line-height: 0.8;
            margin-bottom: auto;
            color: inherit;
        }

        .poster-currency { font-size: 1.5rem; margin-right: 0.2rem; margin-top: 0.5rem; }
        .poster-price-main { font-size: 6rem; font-weight: bold; }
        .poster-price-cents-box { display: flex; flex-direction: column; align-items: flex-start; }
        .poster-price-cents { font-size: 2.8rem; font-weight: bold; text-decoration: underline; }
        .poster-unit { font-size: 1.1rem; text-transform: uppercase; font-weight: bold; margin-top: 0.2rem;}

        .poster-footer {
            font-size: 0.85rem;
            font-weight: 700;
            border-top: 2px dashed rgba(0,0,0,0.3);
            width: 100%;
            padding-top: 0.5rem;
            text-transform: uppercase;
            color: inherit;
        }
        
        /* Ajuste de escala automático para o modo 4 por folha */
        .grid-4-active .poster { border-width: 8px; padding: 0.6rem; }
        .grid-4-active .poster-header { font-size: 1.1rem; padding: 0.1rem 0.8rem; }
        .grid-4-active .poster-product { font-size: 1.1rem; }
        .grid-4-active .poster-price-main { font-size: 3.5rem; }
        .grid-4-active .poster-price-cents { font-size: 1.6rem; }
        .grid-4-active .poster-currency { font-size: 0.9rem; }
        .grid-4-active .poster-unit { font-size: 0.8rem; }
        .grid-4-active .poster-footer { font-size: 0.65rem; }

        .hidden { display: none !important; }

        /* CRÍTICO: Configuração de Impressão Física */
        @media print {
            body *, header, .control-panel { display: none !important; }
            body, .main-container, .preview-area { background: #ffffff !important; padding: 0 !important; margin: 0 !important; height: 100vh !important; width: 100vw !important; display: block !important; }
            .print-sheet { border: none !important; box-shadow: none !important; width: 100vw !important; height: 100vh !important; display: block !important; }
            @page { margin: 0; }
        }
    </style>
</head>
<body>

    <header>
        <button class="btn btn-secondary">← Voltar</button>
        <div style="font-weight: 600;">CartazFast - Impressão Comercial</div>
        <button class="btn btn-success" onclick="window.print()">🖨️ Imprimir Folha</button>
    </header>

    <div class="main-container">
        
        <aside class="control-panel">
            
            <div>
                <div class="section-title">1. Formato da Página</div>
                <div class="form-group" style="margin-bottom: 0.6rem;">
                    <label>Orientação</label>
                    <div class="radio-tile-group">
                        <div id="btn-retrato" class="radio-tile active" onclick="alterarOrientacao('retrato')">Retrato (Padrão)</div>
                        <div id="btn-paisagem" class="radio-tile" onclick="alterarOrientacao('paisagem')">Paisagem</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Divisão da Folha</label>
                    <div class="radio-tile-group">
                        <div id="btn-qtd-1" class="radio-tile active" onclick="alterarDivisao(1)">1 Cartaz Grande</div>
                        <div id="btn-qtd-4" class="radio-tile" onclick="alterarDivisao(4)">4 por Folha</div>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">2. Dados do Produto</div>
                <div class="form-group" style="margin-bottom: 0.6rem;">
                    <label>Nome no Cartaz</label>
                    <input type="text" id="prod-name" value="Arroz Tipo 1 5kg">
                </div>
                
                <div class="price-row" style="margin-bottom: 0.6rem;">
                    <div class="form-group price-main">
                        <label>Preço R$</label>
                        <input type="number" id="prod-price" value="19">
                    </div>
                    <div class="form-group price-cents">
                        <label>Centavos</label>
                        <input type="text" id="prod-cents" value="98" maxlength="2">
                    </div>
                </div>

                <div class="price-row" style="margin-bottom: 0.6rem;">
                    <div class="form-group" style="flex:1;">
                        <label>Unidade</label>
                        <select id="prod-unit">
                            <option value="Un">Un</option>
                            <option value="Kg" selected>Kg</option>
                            <option value="L">Litro</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:2;">
                        <label>Rodapé</label>
                        <input type="text" id="prod-footer" value="Máximo 3 un por cliente">
                    </div>
                </div>

                <button class="btn btn-primary" style="width: 100%; margin-top: 0.3rem;" onclick="adicionarFila()">
                    ➕ Inserir/Salvar na Lista
                </button>
            </div>

            <div>
                <div class="section-title">3. Visual do Cartaz</div>
                <div class="form-group" style="margin-bottom: 0.6rem;">
                    <label>Cor de Fundo / Bordas</label>
                    <div class="radio-tile-group">
                        <div id="btn-bg-amarelo" class="radio-tile active" onclick="alterarCor('bg-amarelo')">Amarelo</div>
                        <div id="btn-bg-vermelho" class="radio-tile" onclick="alterarCor('bg-vermelho')">Vermelho</div>
                        <div id="btn-bg-branco" class="radio-tile" onclick="alterarCor('bg-branco-vermelho')">Branco/Vermelho</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Tipo de Letra</label>
                    <div class="radio-tile-group">
                        <div id="btn-font-letrista" class="radio-tile active" onclick="alterarFonte('font-letrista')">Letrista</div>
                        <div id="btn-font-impact" class="radio-tile" onclick="alterarFonte('font-impact')">Impact</div>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">4. Lista para Impressão (<span id="ui-contador">1</span>)</div>
                <div class="product-list" id="ui-lista-produtos">
                    </div>
            </div>

        </aside>

        <main class="preview-area">
            <div id="print-sheet" class="print-sheet retrato">
                <div id="grid-container" class="grid-container">
                    </div>
            </div>
        </main>
    </div>

    <script>
        // Configurações e Estado Inicial estável
        let config = {
            orientacao: 'retrato',
            divisao: 1,
            temaCor: 'bg-amarelo',
            temaFonte: 'font-letrista'
        };

        // Lista de produtos inicial
        let listaProdutos = [
            { name: "Arroz Tipo 1 5kg", price: "19", cents: "98", unit: "Kg", footer: "Máximo 3 un por cliente" }
        ];

        // Captura de Inputs
        const inName = document.getElementById('prod-name');
        const inPrice = document.getElementById('prod-price');
        const inCents = document.getElementById('prod-cents');
        const inUnit = document.getElementById('prod-unit');
        const inFooter = document.getElementById('prod-footer');

        // Monitor de digitação instantâneo para o primeiro item
        [inName, inPrice, inCents, inUnit, inFooter].forEach(elem => {
            elem.addEventListener('input', () => {
                if(listaProdutos.length > 0) {
                    listaProdutos[0] = {
                        name: inName.value,
                        price: inPrice.value,
                        cents: inCents.value,
                        unit: inUnit.value,
                        footer: inFooter.value
                    };
                    atualizarTela();
                }
            });
        });

        function adicionarFila() {
            listaProdutos.push({
                name: inName.value,
                price: inPrice.value,
                cents: inCents.value,
                unit: inUnit.value,
                footer: inFooter.value
            });
            atualizarTela();
        }

        function removerItem(index) {
            listaProdutos.splice(index, 1);
            atualizarTela();
        }

        function alterarOrientacao(valor) {
            config.orientacao = valor;
            document.getElementById('btn-retrato').classList.toggle('active', valor === 'retrato');
            document.getElementById('btn-paisagem').classList.toggle('active', valor === 'paisagem');
            atualizarTela();
        }

        function alterarDivisao(valor) {
            config.divisao = valor;
            document.getElementById('btn-qtd-1').classList.toggle('active', valor === 1);
            document.getElementById('btn-qtd-4').classList.toggle('active', valor === 4);
            atualizarTela();
        }

        function alterarCor(valor) {
            config.temaCor = valor;
            document.getElementById('btn-bg-amarelo').classList.toggle('active', valor === 'bg-amarelo');
            document.getElementById('btn-bg-vermelho').classList.toggle('active', valor === 'bg-vermelho');
            document.getElementById('btn-bg-branco').classList.toggle('active', valor === 'bg-branco-vermelho');
            atualizarTela();
        }

        function alterarFonte(valor) {
            config.temaFonte = valor;
            document.getElementById('btn-font-letrista').classList.toggle('active', valor === 'font-letrista');
            document.getElementById('btn-font-impact').classList.toggle('active', valor === 'font-impact');
            atualizarTela();
        }

        // Função Central de Renderização (Reconstrói a folha baseada nas opções)
        function atualizarTela() {
            // 1. Ajustar Orientação da Folha container
            const sheet = document.getElementById('print-sheet');
            sheet.className = `print-sheet ${config.orientacao}`;

            // 2. Ajustar Grid interno (1 ou 4 divisões)
            const grid = document.getElementById('grid-container');
            grid.className = 'grid-container';
            if(config.divisao === 4) {
                grid.classList.add('grid-4-active');
            }

            // 3. Montar os cartazes dentro da Folha
            grid.innerHTML = '';
            let totalCartazesParaGerar = config.divisao;

            for(let i = 0; i < totalCartazesParaGerar; i++) {
                // Pega o produto correspondente da lista. Se não houver, deixa um espaço de rascunho
                let item = listaProdutos[i] || { name: "Próximo Produto", price: "00", cents: "00", unit: "un", footer: "Espaço disponível" };
                
                let centavosFormatados = item.cents;
                if(centavosFormatados && !centavosFormatados.startsWith(',')) {
                    centavosFormatados = ',' + centavosFormatados;
                }

                let cartazHTML = `
                    <div class="poster ${config.temaCor} ${config.temaFonte}">
                        <div class="poster-header">OFERTA</div>
                        <div class="poster-product">${item.name}</div>
                        <div class="poster-price-container">
                            <span class="poster-currency">R$</span>
                            <span class="poster-price-main">${item.price}</span>
                            <div class="poster-price-cents-box">
                                <span class="poster-price-cents">${centavosFormatados}</span>
                                <span class="poster-unit">/${item.unit}</span>
                            </div>
                        </div>
                        <div class="poster-footer">${item.footer}</div>
