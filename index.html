<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartazista Pro — Gerador de Cartazes</title>
    <!-- Importação de fontes grossas de impacto de encarte -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Cores inspiradas no Cartazista original */
        :root {
            --bg-principal: #0b1528;
            --bg-paineis: #14223c;
            --cor-primaria: #0284c7;
            --amarelo-cartaz: #fed7aa;
        }

        * { box-sizing: border-box; font-family: 'Barlow Condensed', sans-serif; }

        body {
            background-color: var(--bg-principal);
            color: #fff;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Topo da ferramenta */
        header {
            background-color: var(--bg-paineis);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            border-bottom: 2px solid #1e293b;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        /* Layout em 2 colunas (Painel e Preview) */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Coluna da Esquerda: Configurações */
        .painel-controle {
            width: 400px;
            background-color: var(--bg-paineis);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 2px solid #1e293b;
            overflow-y: auto;
        }

        label {
            font-size: 16px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 180px;
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 6px;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            font-family: monospace;
            resize: none;
        }
        textarea:focus { border-color: var(--cor-primaria); outline: none; }

        .btn-principal {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .btn-principal:hover { background-color: #0284c7; }

        /* Coluna da Direita: Visualização dos Cartazes reais */
        .painel-preview {
            flex: 1;
            background-color: #0f172a;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            align-content: flex-start;
        }

        /* O CARTAZ DE PREÇO (Estilo Supermercado) */
        .cartaz-bloco {
            background-color: #ffe600; /* Amarelo Limão tradicional */
            border: 14px solid #e11d48; /* Borda Vermelha de Impacto */
            width: 320px;
            height: 450px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            text-align: center;
            text-transform: uppercase;
            position: relative;
        }

        .cartaz-header {
            background-color: #e11d48;
            color: #fff;
            font-size: 28px;
            font-family: 'Bebas Neue', sans-serif;
            width: 108%;
            padding: 6px 0;
            margin-top: -10px;
            transform: rotate(-1.5deg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            letter-spacing: 2px;
        }

        .cartaz-produto {
            color: #000;
            font-size: 32px;
            font-weight: 900;
            line-height: 1;
            margin: auto 0;
            word-wrap: break-word;
            max-height: 160px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }

        .cartaz-preco-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: #e11d48;
            font-family: 'Bebas Neue', sans-serif;
        }

        .rs { font-size: 24px; margin-top: 15px; margin-right: 4px; font-weight: bold;}
        .preco-reais { font-size: 115px; line-height: 0.85; font-weight: 900; }
        .preco-centavos { font-size: 50px; line-height: 0.85; margin-top: 5px; font-weight: bold; }

        /* REGRAS EXCLUSIVAS DE IMPRESSÃO - Esconde o Painel Azul */
        @media print {
            .no-print, header, .painel-controle { display: none !important; }
            body, .workspace, .painel-preview { background: none; padding: 0; margin: 0; display: block; overflow: visible; }
            .cartaz-bloco {
                margin: 0 auto;
                page-break-after: always; /* Cada cartaz vai para uma folha separada */
                width: 100%;
                height: 96vh; /* Ocupa a folha A4 inteira vertical */
                border-width: 25px;
                box-shadow: none;
            }
            .preco-reais { font-size: 240px; }
            .preco-centavos { font-size: 100px; }
            .cartaz-produto { font-size: 65px; }
            .cartaz-header { font-size: 55px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>CARTAZISTA PRO</h1>
    </header>

    <div class="workspace">
        <!-- Esquerda: Entradas do Usuário -->
        <div class="painel-controle no-print">
            <div>
                <label>Lista de Ofertas (Produto, Preço)</label>
                <p style="font-size:13px; color:#64748b; margin: 5px 0 10px 0;">Organize separando por vírgula como no modelo:</p>
                <textarea id="inputLista">Detergente Ypê 500ml, 2.49&#10;Feijão Carioca Kicaldo 1kg, 7.89&#10;Cerveja Skol Lata 350ml, 3.19</textarea>
            </div>
            
            <button class="btn-principal" onclick="window.print()">Imprimir Cartazes</button>
        </div>

        <!-- Direita: Renderização Dinâmica em Tempo Real -->
        <div class="painel-preview" id="espacoCartazes">
            <!-- Os cartazes gerados via JavaScript entrarão aqui automaticamente -->
        </div>
    </div>

    <script>
        const inputLista = document.getElementById('inputLista');
        const espacoCartazes = document.getElementById('espacoCartazes');

        function atualizarCartazes() {
            const texto = inputLista.value;
            const linhas = texto.split('\n');
            espacoCartazes.innerHTML = ''; // Limpa o painel visual

            linhas.forEach(linha => {
                if(!linha.trim() || !linha.includes(',')) return;

                const partes = linha.split(',');
                const nomeProduto = partes[0].trim();
                const valorBruto = partes[1].trim();

                // Formatação correta do número de preço
                const precoLimpo = parseFloat(valorBruto.replace(/[^\d.]/g, ''));
                if (isNaN(precoLimpo)) return;

                const precoFinal = precoLimpo.toFixed(2);
                const [reais, centavos] = precoFinal.split('.');

                // Estrutura visual elegante do cartaz de supermercado
                const card = document.createElement('div');
                card.className = 'cartaz-bloco';
                card.innerHTML = `
                    <div class="cartaz-header">OFERTA ESPECIAL</div>
                    <div class="cartaz-produto">${nomeProduto}</div>
                    <div class="cartaz-preco-container">
                        <span class="rs">R$</span>
                        <span class="preco-reais">${reais}</span>
                        <span class="preco-centavos">,${centavos}</span>
                    </div>
                `;
                espacoCartazes.appendChild(card);
            });
        }

        // Evento que escuta o teclado e gera o cartaz NA HORA enquanto o usuário digita
        inputLista.addEventListener('input', atualizarCartazes);

        // Executa uma vez ao abrir o site para carregar os exemplos padrão
        atualizarCartazes();
    </script>

</body>
</html>
