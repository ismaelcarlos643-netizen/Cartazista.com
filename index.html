<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartazista Pro — Gerador de Ofertas</title>
    <!-- Importação de fontes profissionais de alta densidade e estilo pincel de mercado -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Cores do Painel Administrativo Inspiradas no Original */
        :root {
            --bg-dark: #090f1c;
            --bg-card: #121a2e;
            --blue-accent: #0ea5e9;
            --border-line: #1e293b;
        }

        * { box-sizing: border-box; font-family: 'Barlow Condensed', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            padding: 15px 25px;
            border-bottom: 2px solid var(--border-line);
            display: flex;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 26px;
            color: var(--blue-accent);
            letter-spacing: 1.5px;
            font-family: 'Bebas Neue', sans-serif;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Painel Lateral de Controle */
        .painel-lateral {
            width: 360px;
            background-color: var(--bg-card);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 2px solid var(--border-line);
            overflow-y: auto;
        }

        label {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 220px;
            background-color: #060a14;
            border: 2px solid #273549;
            border-radius: 6px;
            color: #fff;
            padding: 12px;
            font-size: 15px;
            font-family: monospace;
            resize: none;
            line-height: 1.4;
        }
        textarea:focus { border-color: var(--blue-accent); outline: none; }

        .btn-print {
            background-color: #22c55e;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .btn-print:active { transform: scale(0.98); }

        /* Área de Visualização (Direita) */
        .painel-visualizacao {
            flex: 1;
            background-color: #060a14;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            align-content: flex-start;
        }

        /* O CARTAZ PROFISSIONAL (Estilo Encarte PDV) */
        .cartaz-bloco {
            background-color: #ffea00; /* Amarelo Puro de Encarte */
            width: 340px;
            height: 480px;
            border: 12px solid #ff0000; /* Borda grossa vermelha */
            outline: 4px solid #ffffff; /* Linha branca de contraste interna */
            outline-offset: -8px;
            border-radius: 4px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 15px 15px 15px;
            text-align: center;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        /* Explosão/Faixa de Oferta Superior */
        .cartaz-tag {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: #ffffff;
            font-family: 'Anton', sans-serif;
            font-size: 38px;
            width: 120%;
            padding: 6px 0;
            margin-top: -10px;
            transform: rotate(-2.5deg);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #000000; /* Sombra seca estilo quadrinhos/supermercado */
            border-bottom: 3px solid #ffea00;
        }

        /* Nome do Produto em Destaque Absoluto */
        .cartaz-titulo {
            color: #000000;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-style: italic; /* Inclinação de velocidade/promoção */
            font-size: 42px;
            line-height: 0.9;
            margin: auto 0;
            word-wrap: break-word;
            width: 100%;
            padding: 0 10px;
            letter-spacing: -1px;
            /* Efeito de preenchimento pesado */
            text-shadow: 1px 1px 0px #fff, -1px -1px 0px #fff; 
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Container do Preço com Centavos Flutuantes Suspensos */
        .cartaz-preco-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: #ff0000;
            font-family: 'Anton', sans-serif;
            width: 100%;
            margin-bottom: 5px;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.15);
        }

        .cartaz-rs {
            font-size: 26px;
            font-weight: bold;
            margin-top: 12px;
            margin-right: 4px;
            font-family: 'Bebas Neue', sans-serif;
        }

        .cartaz-reais {
            font-size: 155px;
            line-height: 0.75;
            letter-spacing: -5px;
        }

        .cartaz-centavos-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-top: 12px;
            margin-left: -2px;
        }

        .cartaz-centavos {
            font-size: 68px;
            line-height: 0.75;
            border-bottom: 4px solid #ff0000; /* Linha abaixo dos centavos suspensos */
            padding-bottom: 2px;
        }

        /* REGRAS DE IMPRESSÃO (Ajusta dinamicamente para folha A4 cheia) */
        @media print {
            .no-print, header, .painel-lateral { display: none !important; }
            body, .workspace, .painel-visualizacao { background: none; padding: 0; margin: 0; display: block; overflow: visible; }
            
            .cartaz-bloco {
                margin: 0 auto;
                page-break-after: always;
                width: 100%;
                height: 99vh;
                box-shadow: none;
                border-radius: 0;
                padding: 50px 30px;
                border-width: 25px;
                outline-width: 8px;
                outline-offset: -18px;
            }
            .cartaz-tag { font-size: 75px; padding: 12px 0; border-bottom-width: 6px; }
            .cartaz-titulo { font-size: 85px; text-shadow: 2px 2px 0px #fff; }
            .cartaz-reais { font-size: 340px; }
            .cartaz-centavos { font-size: 140px; border-bottom-width: 8px; }
            .cartaz-rs { font-size: 55px; margin-top: 30px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>CARTAZISTA PRO</h1>
    </header>

    <div class="workspace">
        <!-- Esquerda: Entrada de Dados Administrativa -->
        <div class="painel-lateral no-print">
            <div>
                <label>Lista de Ofertas</label>
                <p style="font-size:12px; color:#64748b; margin: 5px 0 12px 0;">Insira o nome do produto e o preço divididos por uma vírgula:</p>
                
                <textarea id="txtInput" oninput="renderizar()">Saboroso Arroz 5kg, 24.99&#10;Feijão Carioquinha 1kg, 7.45&#10;Óleo de Soja Leve, 6.18&#10;Leite Integral 1L, 4.39</textarea>
            </div>
            
            <button class="btn-print" onclick="window.print()">Imprimir Cartazes</button>
        </div>

        <!-- Direita: Área de Renderização Real dos Cartazes -->
        <div class="painel-visualizacao" id="containerCartazes"></div>
    </div>
