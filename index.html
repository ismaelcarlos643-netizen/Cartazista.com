<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartazista Pro</title>
    <!-- Fontes ultra grossas e condensadas de supermercado -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a111e;
            --bg-card: #131c2e;
            --accent-blue: #0ea5e9;
        }

        * { box-sizing: border-box; font-family: 'Barlow Condensed', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            padding: 15px 30px;
            border-bottom: 2px solid #1e293b;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--accent-blue);
            letter-spacing: 1px;
            font-family: 'Bebas Neue', sans-serif;
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Painel do Usuário (Esquerda) */
        .painel-lateral {
            width: 360px;
            background-color: var(--bg-card);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 2px solid #1e293b;
            overflow-y: auto;
        }

        label {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 250px;
            background-color: #070d19;
            border: 2px solid #273549;
            border-radius: 6px;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            font-family: monospace;
            resize: none;
        }
        textarea:focus { border-color: var(--accent-blue); outline: none; }

        .btn-print {
            background-color: #22c55e;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Área dos Cartazes (Direita) */
        .painel-visualizacao {
            flex: 1;
            background-color: #070d19;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-content: flex-start;
        }

        /* O CARTAZ DE PREÇO (Inspirado no Cartazista.online) */
        .cartaz-bloco {
            background-color: #ffeb00; /* Amarelo forte */
            width: 320px;
            height: 460px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            text-align: center;
            text-transform: uppercase;
            position: relative;
        }

        /* Faixa Vermelha Inclinada */
        .cartaz-tag {
            background-color: #ff0000;
            color: #ffffff;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px;
            width: 115%;
            padding: 8px 0;
            margin-top: -5px;
            transform: rotate(-3deg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }

        /* Produto centralizado e gigante */
        .cartaz-titulo {
            color: #000000;
            font-size: 40px;
            font-weight: 900;
            line-height: 0.95;
            margin: auto 0;
            word-wrap: break-word;
            width: 100%;
        }

        /* Bloco de Preço com Centavos no Topo */
        .cartaz-preco-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Alinha tudo por cima */
            color: #ff0000;
            font-family: 'Bebas Neue', sans-serif;
            width: 100%;
            margin-bottom: 10px;
        }

        .cartaz-rs {
            font-size: 26px;
            font-weight: 900;
            margin-top: 10px;
            margin-right: 2px;
        }

        .cartaz-reais {
            font-size: 150px;
            line-height: 0.8;
            font-weight: 900;
        }

        .cartaz-centavos {
            font-size: 65px;
            line-height: 0.8;
            font-weight: 900;
            margin-top: 8px;
        }

        /* CONFIGURAÇÕES DE IMPRESSÃO (Esconde o menu azul) */
        @media print {
            .no-print, header, .painel-lateral { display: none !important; }
            body, .workspace, .painel-visualizacao { background: none; padding: 0; margin: 0; display: block; overflow: visible; }
            
            .cartaz-bloco {
                margin: 0 auto;
                page-break-after: always;
                width: 100%;
                height: 98vh;
                box-shadow: none;
                border-radius: 0;
                padding: 40px;
            }
            .cartaz-tag { font-size: 65px; padding: 15px 0; }
            .cartaz-titulo { font-size: 80px; }
            .cartaz-reais { font-size: 300px; }
            .cartaz-centavos { font-size: 130px; }
            .cartaz-rs { font-size: 50px; margin-top: 25px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>CARTAZISTA PRO</h1>
    </header>

    <div class="workspace">
        <!-- Esquerda: Entrada de Dados -->
        <div class="painel-lateral no-print">
            <div>
                <label>Produtos e Ofertas</label>
                <p style="font-size:12px; color:#64748b; margin: 5px 0 10px 0;">Digite o produto e o preço separados por apenas uma vírgula:</p>
                
                <textarea id="txtInput" oninput="renderizar()">Arroz Tio João 5kg, 24.99&#10;Feijão Carioca 1kg, 7.49&#10;Óleo de Soja 900ml, 6.15</textarea>
            </div>
            
            <button class="btn-print" onclick="window.print()">Imprimir Cartazes</button>
        </div>

        <!-- Direita: Visualização dos Cartazes -->
        <div class="painel-visualizacao" id="containerCartazes"></div>
    </div>

    <script>
        function renderizar() {
            const txtInput = document.getElementById('txtInput');
            const containerCartazes = document.getElementById('containerCartazes');
            
            const linhas = txtInput.value.split('\n');
            containerCartazes.innerHTML = ''; 

            linhas.forEach(linha => {
                // Se a linha não tiver uma vírgula, ignora para não quebrar o código
                if (!linha.trim() || !linha.includes(',')) return;

                // Divide estritamente na primeira vírgula encontrada
                const posicaoVirgula = linha.indexOf(',');
                const produto = linha.substring(0, posicaoVirgula).trim();
                const precoBruto = linha.substring(posicaoVirgula + 1).trim();

                // Extrai apenas os números do preço
                const precoNum = parseFloat(precoBruto.replace(/[^\d.]/g, ''));
                if (isNaN(precoNum)) return;

                // Separa os reais dos centavos
                const [reais, centavos] = precoNum.toFixed(2).split('.');

                // Cria o elemento visual do cartaz
                const div = document.createElement('div');
                div.className = 'cartaz-bloco';
                
                div.innerHTML = `
                    <div class="cartaz-tag">OFERTA</div>
                    <h2 class="cartaz-titulo">${produto}</h2>
                    <div class="cartaz-preco-wrapper">
                        <span class="cartaz-rs">R$</span>
                        <span class="cartaz-reais">${reais}</span>
                        <span class="cartaz-centavos">,${centavos}</span>
                    </div>
                `;
                
                containerCartazes.appendChild(div);
            });
        }

        // Executa automaticamente ao abrir o site para carregar os exemplos
        renderizar();
    </script>

</body>
</html>
